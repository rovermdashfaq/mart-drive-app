name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: false

    - name: Remove broken android folder
      run: rm -rf android

    - name: Create android folder
      run: flutter create --platforms=android --project-name mart_drive .

    - name: Update Android Manifest
      run: |
        sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

    # NEW: enable core library desugaring (required by flutter_local_notifications)
    - name: Enable core library desugaring
      run: |
        F=android/app/build.gradle.kts
        if [ -f "$F" ]; then
          sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$F"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$F"
        else
          F=android/app/build.gradle
          sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' "$F"
          printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> "$F"
        fi
        echo "---- patched $F ----"
        grep -n -i "desugar" "$F"

    # NEW: force all plugins to compile against SDK 36
    - name: Force compileSdk 36 for all plugins
      run: |
        R=android/build.gradle.kts
        if [ -f "$R" ]; then
          cat > /tmp/sdkfix.kts << 'EOP'
        subprojects {
            plugins.withId("com.android.library") {
                extensions.configure<com.android.build.gradle.LibraryExtension> {
                    compileSdk = 36
                }
            }
        }

        EOP
          cat /tmp/sdkfix.kts "$R" > /tmp/root.kts
          mv /tmp/root.kts "$R"
        else
          R=android/build.gradle
          printf '\nsubprojects {\n    afterEvaluate { p ->\n        if (p.hasProperty("android")) { p.android.compileSdkVersion 36 }\n    }\n}\n' >> "$R"
        fi
        head -15 "$R"

    - name: Setup Google Services
      run: |
        cat << 'EOG' > android/app/google-services.json
        {
          "project_info": {
            "project_number": "829348083361",
            "project_id": "mart-drive",
            "storage_bucket": "mart-drive.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:829348083361:android:7f6d8b6c8c7e2f6a",
                "android_client_info": { "package_name": "com.example.mart_drive" }
              },
              "api_key": [ { "current_key": "AIzaSyDUcT6hVqLHy3pYzwg1oktI7amTpF9Qj4c" } ]
            }
          ],
          "configuration_version": "1"
        }
        EOG

    - name: Get dependencies
      run: flutter pub get

    - name: Patch InAppWebView Gradle File
      run: |
        GRADLE_FILE=$(find /home/runner/.pub-cache -path "*flutter_inappwebview_android*/android/build.gradle" | head -n 1)
        if [ -n "$GRADLE_FILE" ]; then
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$GRADLE_FILE"
          echo "Patched: $GRADLE_FILE"
        else
          echo "Gradle file not found, skipping."
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MART-Drive-APK
        path: build/app/outputs/flutter-apk/app-release.apk
