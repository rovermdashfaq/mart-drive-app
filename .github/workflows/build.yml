name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: false

    # Unpack the full app source from a zip uploaded to the repo root
    - name: Unpack app source zip
      run: |
        Z=$(ls *.zip *.ZIP 2>/dev/null | head -n 1)
        if [ -n "$Z" ]; then
          echo "Unpacking $Z"
          unzip -o "$Z" "lib/*" "pubspec.yaml" -d .
          find lib -name "*.dart" | wc -l
        else
          echo "No zip found, using repo files as they are."
        fi

    # Newer Flutter: ThemeData.cardTheme needs CardThemeData
    - name: Fix CardTheme for new Flutter
      run: |
        sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/g' lib/core/theme.dart
        grep -n "cardTheme" lib/core/theme.dart

    # Asset/font files are not in the zip: remove them from pubspec (app falls back to the default font)
    - name: Remove missing assets and fonts from pubspec
      run: |
        sed -i '/^  assets:/,$d' pubspec.yaml
        sed -n '/^flutter:/,$p' pubspec.yaml

    # Use the real Firebase Android app (com.mart.drive) and web client id for Google Sign-In
    - name: Patch Firebase options and Google Sign-In
      run: |
        sed -i "/static const FirebaseOptions android/,/);/ s/apiKey: '[^']*'/apiKey: 'AIzaSyBjtYjThH1_e4CR5nHAgEpM9bkC-umus2w'/" lib/firebase_options.dart
        sed -i "/static const FirebaseOptions android/,/);/ s/appId: '[^']*'/appId: '1:829348083361:android:8f65cbef816e10cd53e2e0'/" lib/firebase_options.dart
        sed -i "0,/scopes: \[/s//serverClientId: '829348083361-5q4raoou5ia32tf0dc8ak6086hhbushv.apps.googleusercontent.com',\n      scopes: [/" lib/services/auth_service.dart
        sed -n '/static const FirebaseOptions android/,/);/p' lib/firebase_options.dart
        sed -n 10,20p lib/services/auth_service.dart

    - name: Remove broken android folder
      run: rm -rf android

    - name: Create android folder
      run: flutter create --platforms=android --project-name mart_drive .

    # App is registered in Firebase as com.mart.drive (flutter create makes com.mart.drive)
    - name: Set applicationId to com.mart.drive
      run: |
        sed -i 's/applicationId = "com.example.mart_drive"/applicationId = "com.mart.drive"/' android/app/build.gradle.kts || true
        sed -i 's/applicationId "com.example.mart_drive"/applicationId "com.mart.drive"/' android/app/build.gradle || true
        grep -n "applicationId" android/app/build.gradle* || true

    - name: Update Android Manifest
      run: |
        sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

    # NEW: enable core library desugaring (required by flutter_local_notifications)
    - name: Enable core library desugaring
      run: |
        F=android/app/build.gradle.kts
        if [ -f "$F" ]; then
          sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$F"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$F"
        else
          F=android/app/build.gradle
          sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' "$F"
          printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> "$F"
        fi
        echo "---- patched $F ----"
        grep -n -i "desugar" "$F"

    # Force every plugin to compile against SDK 36 (runs AFTER each plugin's own config)
    - name: Force compileSdk 36 for all plugins
      run: |
        mkdir -p ~/.gradle/init.d
        cat > ~/.gradle/init.d/sdk36.gradle << 'EOP'
        allprojects {
            afterEvaluate { p ->
                if (p.hasProperty("android") && p.plugins.hasPlugin("com.android.library")) {
                    p.android.compileSdkVersion 36
                }
            }
        }
        EOP
        cat ~/.gradle/init.d/sdk36.gradle

    - name: Setup Google Services
      run: |
        cat << 'EOG' > android/app/google-services.json
        {
          "project_info": {
            "project_number": "829348083361",
            "project_id": "mart-drive",
            "storage_bucket": "mart-drive.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:829348083361:android:8f65cbef816e10cd53e2e0",
                "android_client_info": {
                  "package_name": "com.mart.drive"
                }
              },
              "oauth_client": [
                {
                  "client_id": "829348083361-5q4raoou5ia32tf0dc8ak6086hhbushv.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyBjtYjThH1_e4CR5nHAgEpM9bkC-umus2w"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [
                    {
                      "client_id": "829348083361-5q4raoou5ia32tf0dc8ak6086hhbushv.apps.googleusercontent.com",
                      "client_type": 3
                    }
                  ]
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOG

    - name: Get dependencies
      run: flutter pub get

    - name: Patch InAppWebView Gradle File
      run: |
        GRADLE_FILE=$(find /home/runner/.pub-cache -path "*flutter_inappwebview_android*/android/build.gradle" | head -n 1)
        if [ -n "$GRADLE_FILE" ]; then
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$GRADLE_FILE"
          echo "Patched: $GRADLE_FILE"
        else
          echo "Gradle file not found, skipping."
        fi

    # Keep the SAME signing key on every build (needed for Google Sign-In SHA-1)
    - name: Restore signing keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: mart-debug-keystore-v1

    - name: Build APK
      run: flutter build apk --release

    - name: Print SHA-1 for Firebase
      run: |
        keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1|SHA256"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MART-Drive-APK
        path: build/app/outputs/flutter-apk/app-release.apk
