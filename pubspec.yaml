name: mart_drive
description: "MART Drive - Mobile app for MART Drive cloud workspace, files, notes, and team collaboration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2
  dio: ^5.7.0
  go_router: ^14.3.2
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  flutter_svg: ^2.0.10+1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  image_cropper: ^8.0.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  pdfx: ^2.9.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0-beta.2
  flutter_highlight: ^0.7.0
  flutter_inappwebview: ^6.0.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  crypto: ^3.0.5
  pointycastle: ^3.9.1
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  timeago: ^3.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
